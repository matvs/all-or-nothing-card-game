name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          path: app

      # This app's Dockerfile reads the named build context `matvs_core`, because its
      # @matvs/core-* packages are `file:../core/...` deps living in a separate private
      # repo. The default GITHUB_TOKEN cannot check out another repo.
      - name: Check out matvs/core
        uses: actions/checkout@v4
        with:
          repository: matvs/core
          token: ${{ secrets.CORE_CHECKOUT_TOKEN }}
          path: core

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: app
          build-contexts: |
            matvs_core=core
          push: true
          tags: |
            ghcr.io/matvs/${{ github.event.repository.name }}:latest
            ghcr.io/matvs/${{ github.event.repository.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
