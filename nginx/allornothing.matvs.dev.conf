# All or Nothing — host nginx vhost for the droplet.
#
# Install:
#   sudo cp nginx/allornothing.matvs.dev.conf /etc/nginx/sites-available/allornothing.matvs.dev.conf
#   sudo ln -s /etc/nginx/sites-available/allornothing.matvs.dev.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d allornothing.matvs.dev
#   sudo nginx -t && sudo systemctl reload nginx
#
# The app is a single container published on 127.0.0.1:8462 that serves the
# frontend, the REST API (/api) and the WebSocket endpoint (/ws). The only
# subtlety is that /ws needs the HTTP/1.1 Upgrade dance to become a WebSocket.

# Shared map: sets the Connection header to "upgrade" for WS handshakes and
# "close" otherwise. Define once (safe to keep in the vhost).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name allornothing.matvs.dev;
    # Everything to HTTPS (certbot also manages this once issued).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name allornothing.matvs.dev;

    # Managed by certbot after `certbot --nginx -d allornothing.matvs.dev`:
    ssl_certificate     /etc/letsencrypt/live/allornothing.matvs.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allornothing.matvs.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # STOMP-over-WebSocket endpoint: long-lived, upgraded connection. Keep the
    # read timeout generous so an idle lobby is not culled.
    location /stomp {
        proxy_pass         http://127.0.0.1:8462;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API: never cache.
    location /api/ {
        proxy_pass         http://127.0.0.1:8462;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "no-store" always;
    }

    # App shell + hashed assets. The Node process already sets sensible
    # Cache-Control (1h) on static files; hashed asset names make that safe.
    location / {
        proxy_pass         http://127.0.0.1:8462;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
