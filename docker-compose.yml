# All or Nothing (SET) — one Node service serving the frontend + REST + Socket.IO.
# Published on 127.0.0.1:8462 ONLY (loopback); the droplet's host nginx
# terminates TLS and proxies to it (see nginx/allornothing.matvs.dev.conf).
# Stateless: multiplayer rooms are in-memory, solo scores are in localStorage,
# so there is no database and no volume.
#
#   docker compose up -d --build
#
services:
  app:
    build:
      context: .
      additional_contexts:
        # Shared @matvs/core-realtime lives in the sibling core repo; the app's `file:` dependency
        # resolves against it during the image build. The Dockerfile compiles its dist in-image
        # (stage `core-realtime`), so no host pre-build is required.
        matvs_core: ../core
    image: allornothing-set:latest
    container_name: allornothing-set
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8462"
      TZ: Europe/Warsaw
    ports:
      # Loopback bind only — reachable from the Windows browser via WSL2
      # localhost forwarding, never exposed on other interfaces.
      - "127.0.0.1:8462:8462"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8462/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 8s
